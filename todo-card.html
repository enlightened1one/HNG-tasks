<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Advanced Todo Card</title>
  </head>
  <body>
    <main class="todo-section flex flex-col gap-4">
      <h1 class="page-title text-2xl font-semibold">To-Do Card Page</h1>

      <section role="region" class="Card-container flex flex-col gap-4" data-testid="test-todo-card">
        
        <!-- TITLE -->
        <h3 data-testid="test-todo-title">Submit Report</h3>

        <!-- DESCRIPTION -->
        <p data-testid="test-todo-description"></p>

        <button id="expandToggle" data-testid="test-todo-expand-toggle">Show more</button>
        <div id="collapsibleSection" data-testid="test-todo-collapsible-section"></div>

        <!-- PRIORITY -->
        <div>
          <span>Priority:</span>
          <span data-testid="test-todo-priority" id="priorityText"></span>
          <span data-testid="test-todo-priority-indicator" id="priorityIndicator"></span>
        </div>

        <!-- DUE DATE -->
        <div>
          <span>Due Date:</span>
          <time id="dueDate" data-testid="test-todo-due-date"></time>
        </div>

        <!-- TIME -->
        <div>
          <span>Time Remaining:</span>
          <time id="timeRemaining" data-testid="test-todo-time-remaining"></time>
          <span data-testid="test-todo-overdue-indicator" id="overdueIndicator" style="display:none;color:red;">Overdue</span>
        </div>

        <!-- STATUS -->
        <div>
          <span data-testid="test-todo-status" id="status"></span>
          <select id="statusControl" data-testid="test-todo-status-control">
            <option>Pending</option>
            <option>In Progress</option>
            <option>Done</option>
          </select>
        </div>

        <!-- CHECKBOX -->
        <input type="checkbox" id="status_toggle" data-testid="test-todo-complete-toggle" />

        <!-- EDIT BUTTON -->
        <button data-testid="test-todo-edit-button" id="editBtn">Edit</button>

        <!-- EDIT FORM -->
        <form id="editForm" data-testid="test-todo-edit-form" style="display:none;">
          <input id="editTitle" data-testid="test-todo-edit-title-input" />
          <textarea id="editDesc" data-testid="test-todo-edit-description-input"></textarea>

          <select id="editPriority" data-testid="test-todo-edit-priority-select">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>

          <input type="date" id="editDate" data-testid="test-todo-edit-due-date-input" />

          <button type="button" id="saveBtn" data-testid="test-todo-save-button">Save</button>
          <button type="button" id="cancelBtn" data-testid="test-todo-cancel-button">Cancel</button>
        </form>

      </section>
    </main>

    <script type="module" src="/src/todoCard.js"></script>
  </body>
</html>
