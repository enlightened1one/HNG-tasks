<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Document</title>
  </head>
  <body class="">
    <main class="todo-section flex flex-col gap-4">
      <h1 class="page-title text-2xl font-semibold">To-Do Card Page</h1>

      <section
        role="region"
        class="Card-container flex flex-col gap-4"
        data-testid="test-todo-card"
      >
        <h3
          class="task-title text-lg font-bold w-full text-start"
          data-testid="test-todo-title"
        >
          Submit Report
        </h3>
        <p
          class="task-description w-full text-start text-[#6b7280]"
          data-testid="test-todo-description"
        >
          Prepare and submit the quarterly financial report to the management by
          the end of the week.
        </p>

        <!-- -------BADGE-------- -->
        <div
          class="priority-badge flex flex-row justify-start items-center gap-4 w-full"
        >
          <span class="priority-label">Priority:</span>
          <span
            data-testid="test-todo-priority"
            class="priority-value flex flex-row justify-center items-center rounded-full px-4 py-1 bg-[#d00000] text-white"
            >High</span
          >
        </div>

        <!-- --------DUE DATE-------- -->
        <div class="due-date flex flex-row justify-start w-full gap-2">
          <span class="date-label">Due Date:</span>
          <time
            datetime="2026-05-15"
            data-testid="test-todo-due-date"
            id="dueDate"
            class="date-value"
            >2026-5-15</time
          >
        </div>

        <!-- -----------TIME REMAINING----------- -->
        <div class="time-remaining w-full flex flex-row justify-start gap-2">
          <span class="time-label">Time Remaining:</span>
          <!-- <span
            class="time-value"
            id="timeRemaining"
            data-testid="test-todo-time-remaining"
            >2 days</span
          > -->
          <time
            class="time-value"
            id="timeRemaining"
            data-testid="test-todo-time-remaining"
          >
          </time>
        </div>

        <!-- -----------STATUS INDICATOR----------- -->
        <div class="flex flex-col w-full gap-1">
          <span class="status-label">Status:</span>
          <span
            id="status"
            class="status-indicator"
            data-testid="test-todo-status"
            >In Progress</span
          >
          <div id="progressLoader" class="progress w-full rounded-full"></div>
        </div>

        <!-- ----------TO-DO Complete Toggle------------- -->
        <div class="flex items-center mb-4">
          <input
            data-testid="test-todo-complete-toggle"
            id="status_toggle"
            type="checkbox"
            value=""
            class="w-4 h-4 border border-amber-950 rounded-lg bg-neutral-500 focus:ring-2 focus:ring-blue-800"
          />
          <label
            for="status_toggle"
            class="select-none ms-2 text-sm font-medium text-heading"
            >Toggle Status</label
          >
        </div>

        <!-- --------Categories list---------  -->
        <div class="categories-list flex flex-col w-full gap-2">
          <span class="categories-label">Categories:</span>
          <ul
            class="categories flex flex-row justify-start items-center gap-2"
            data-testid="test-todo-tags"
          >
            <li
              class="bg-[#ee9b00a6] outline outline-[#ee9b00] text-white rounded-full px-2 py-1"
            >
              Work
            </li>
            <li
              class="bg-[#3b83f68a] outline outline-[#3b83f6] text-white rounded-full px-2 py-1"
            >
              Personal
            </li>
            <li
              class="bg-[#f8717179] outline outline-[#f87171] text-white rounded-full px-2 py-1"
            >
              Urgent
            </li>
          </ul>
        </div>

        <div
          class="buttons flex flex-row justify-start items-center gap-4 py-2 w-full"
        >
          <button
            data-testid="test-todo-edit-button"
            class="edit-button px-4 py-2 rounded-full bg-[#2563eb] text-white flex flex-row gap-2 items-center"
          >
            Edit
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="1rem"
              viewBox="0 -960 960 960"
              width="1rem"
              fill="#FFFFFF"
            >
              <path
                d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"
              />
            </svg>
          </button>
          <button
            data-testid="test-todo-delete-button"
            class="delete-button cursor-pointer px-4 py-2 bg-[#EA3323] rounded-full text-white flex flex-row justify-center items-center gap-2"
          >
            Delete
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="1rem"
              viewBox="0 -960 960 960"
              width="1rem"
              fill="#FFFFFF"
            >
              <path
                d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"
              />
            </svg>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/todoCard.js"></script>
  </body>
</html>
